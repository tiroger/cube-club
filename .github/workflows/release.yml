name: Release DMG

# Push a tag such as v0.10.0 to test, package and publish a GitHub release.
# Pull requests that touch packaging build the DMG as a downloadable artifact only.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build.sh
      - scripts/build-dmg.sh
      - scripts/package-dmg.py
      - scripts/prepare-dmg-background.swift
      - scripts/requirements-dmg.txt
      - scripts/dmg-layout.json
      - scripts/Info.plist
      - scripts/CubeClub.entitlements
      - scripts/make-appcast.sh
      - scripts/sign-app.sh
      - scripts/notarize.sh
      - Package.swift
      - Package.resolved
      - assets/dmg/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    # Tag builds use the release environment, which holds the signing secrets, admits only
    # v* tags, and waits for a maintainer's approval. Other runs get no secrets and build ad hoc.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The packager needs Python 3.11+ (hashlib.file_digest).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Read the app version
        id: version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw scripts/Info.plist)
          build=$(plutil -extract CFBundleVersion raw scripts/Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Cube Club $version (build $build)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $version. Tag v$version instead."
            exit 1
          fi

      - name: Run tests
        run: ./scripts/test.sh

      # A throwaway keychain holds the Developer ID certificate for this run only.
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "::error::DEVELOPER_ID_CERTIFICATE is not set."; exit 1; fi
            echo "No certificate on this run; building ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077; printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [[ -n "$identity" ]] || { echo "::error::The certificate has no Developer ID Application identity."; exit 1; }
          echo "Signing with $identity"
          echo "CUBE_CLUB_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and verify the DMG
        run: ./scripts/build-dmg.sh

      # Stapling changes the DMG, so this runs before the update feed is signed.
      - name: Notarize the DMG
        if: env.CUBE_CLUB_SIGN_IDENTITY != ''
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$APP_STORE_CONNECT_KEY" || -z "$APP_STORE_CONNECT_KEY_ID" || -z "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            echo "::error::The App Store Connect API key secrets are not all set."
            exit 1
          fi
          export APP_STORE_CONNECT_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$APP_STORE_CONNECT_KEY_FILE")
          trap 'rm -f "$APP_STORE_CONNECT_KEY_FILE"' EXIT
          ./scripts/notarize.sh dist/Cube-Club-"$VERSION"-*.dmg

      # Installed copies read releases/latest/download/appcast.xml and accept only
      # DMGs signed with this key (its public half is SUPublicEDKey in Info.plist).
      - name: Sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "::error::SPARKLE_PRIVATE_KEY is not set."; exit 1; fi
            echo "No signing key on this run; skipping the update feed."
            exit 0
          fi
          dmg=$(ls dist/Cube-Club-"$VERSION"-*.dmg)
          key="$RUNNER_TEMP/sparkle.key"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          ./scripts/make-appcast.sh "build/Cube Club.app" "$dmg" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$dmg")" dist/appcast.xml "$key"

      - name: Upload the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cube-Club-${{ steps.version.outputs.version }}
          path: |
            dist/Cube-Club-${{ steps.version.outputs.version }}-*.dmg
            dist/Cube-Club-${{ steps.version.outputs.version }}-*.dmg.sha256
            dist/appcast.xml
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          # Release notes: this version's section of docs/VERIFICATION.md, if there is one.
          # Its checksum describes a local build, so it is replaced with this download's.
          awk -v heading="## Version $VERSION " 'index($0, heading) == 1 {on=1; next} on && /^## / {exit} on' docs/VERIFICATION.md \
            | sed -E 's/ SHA-256: `[0-9a-f]{64}`\.//' > notes.md
          checksum=$(cut -d' ' -f1 dist/Cube-Club-"$VERSION"-*.dmg.sha256)
          {
            echo "Cube Club $VERSION (build $BUILD) for Apple silicon Macs."
            echo
            echo "Signed with a Developer ID and notarized by Apple. Open the DMG and drag Cube Club to Applications. Installed copies of 0.11.0 or later update themselves."
            echo
            cat notes.md
            echo
            echo "SHA-256 of the DMG: \`$checksum\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/Cube-Club-"$VERSION"-*.dmg dist/Cube-Club-"$VERSION"-*.dmg.sha256 dist/appcast.xml \
            --title "Cube Club $VERSION" --notes-file release-notes.md --verify-tag

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
