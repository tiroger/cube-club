name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # WebKit and Vision tests need a real macOS session; GitHub's macOS runners provide one.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run tests
        run: ./scripts/test.sh

      # The test scripts compile only the Swift files each suite needs, so build
      # the whole app too. This is the only step that compiles App.swift.
      - name: Build the app
        run: ./scripts/build.sh

      - name: Launch the app without the build folder
        run: ./scripts/smoke-launch.sh
